<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Agent Ops">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151515" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/app/icons/icon-192.png">
<link rel="apple-touch-icon" href="/app/icons/apple-touch-icon.png">
<title>Agent Ops</title>
<style>
  :root {
    --bg: #f6f6f4; --card: #ffffff; --ink: #1b1b1a; --muted: #6b6b66; --line: #e4e4df;
    --accent: #2f5bd3; --accent-ink: #ffffff; --danger: #b3261e; --problem: #b45309; --ok: #2e7d32;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151515; --card: #1f1f1e; --ink: #ececea; --muted: #9a9a94; --line: #2e2e2c;
            --accent: #7c9cff; --accent-ink: #0e1430; --danger: #ff8a80; --problem: #fbbf24; --ok: #81c784; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; -webkit-text-size-adjust: 100%;
         padding: env(safe-area-inset-top) 0 calc(64px + env(safe-area-inset-bottom)); }
  main { max-width: 640px; margin: 0 auto; padding: 12px 16px 24px; }
  header.top { display: flex; align-items: baseline; justify-content: space-between; margin: 8px 0 4px; }
  .brand { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  h1 { font-size: 28px; margin: 4px 0 16px; display: flex; justify-content: space-between; align-items: baseline; }
  h1 .count { font-size: 22px; color: var(--muted); font-weight: 600; }
  h2 { font-size: 20px; margin: 8px 0 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 14px 12px; margin-bottom: 10px; }
  .card.tap { cursor: pointer; }
  .src { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
  .src .sev-problem { color: var(--problem); }
  .src .sev-decision { color: var(--accent); }
  .title { font-weight: 600; margin: 4px 0 2px; }
  .summary { color: var(--muted); font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  button, .btn { appearance: none; border: 1px solid var(--line); background: transparent; color: var(--ink); font: inherit; font-size: 15px;
                 padding: 9px 14px; border-radius: 10px; min-height: 40px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .5; }
  .empty { text-align: center; color: var(--muted); padding: 48px 8px; }
  .empty b { display: block; color: var(--ink); font-size: 18px; margin-bottom: 4px; }
  dl { margin: 0; } dt { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-top: 12px; }
  dd { margin: 2px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .back { color: var(--accent); background: none; border: none; padding: 8px 0; min-height: 0; }
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
             display: flex; padding-bottom: env(safe-area-inset-bottom); }
  nav.tabs a { flex: 1; text-align: center; padding: 12px 4px; color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 600; }
  nav.tabs a.on { color: var(--accent); }
  nav.tabs .badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font-size: 12px; }
  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(76px + env(safe-area-inset-bottom)); margin: 0 auto; max-width: 600px;
           background: var(--ink); color: var(--bg); padding: 12px 14px; border-radius: 12px; font-size: 15px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.on { opacity: 1; }
  input.code { letter-spacing: .3em; font-variant-numeric: tabular-nums; }
  /* ≥16px on focusable inputs, or iOS Safari zooms the page on focus and never zooms back. */
  input[type=email], input.code { width: 100%; font: inherit; font-size: 16px; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); margin: 8px 0 12px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .muted { color: var(--muted); font-size: 14px; }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .pill.healthy { color: var(--ok); } .pill.failing, .pill.blocked { color: var(--problem); }
  ul.items { list-style: none; padding: 0; margin: 0; }
  ul.items li { padding: 10px 0; border-top: 1px solid var(--line); } ul.items li:first-child { border-top: 0; }
  /* brief cards */
  .meeting .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .meeting .head .title { font-size: 17px; margin: 0; }
  .meeting .head .muted { white-space: nowrap; }
  .label { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 12px 0 2px; }
  .bullets { margin: 0; padding-left: 18px; } .bullets li { margin: 2px 0; }
  .kv { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 4px 0; }
  .kv a { color: var(--accent); text-decoration: none; overflow-wrap: anywhere; }
  .tag { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .ok { color: var(--ok); font-weight: 600; } .warn { color: var(--problem); }
  .deeper { background: var(--bg); border-radius: 10px; padding: 10px 12px; margin-top: 10px; white-space: pre-wrap; font-size: 15px; }
  .deeper { white-space: normal; } .deeper b { display: block; margin-top: 8px; } .deeper div { min-height: 1em; }
  .linkbtn { background: none; border: none; color: var(--accent); padding: 4px 0; min-height: 0; font-size: 14px; }
  .dismissed .kv { color: var(--muted); }
</style>
</head>
<body>
<main id="view"><p class="muted">Loading…</p></main>
<nav class="tabs" id="tabs" hidden>
  <a href="#/" data-tab="needs">Needs You<span class="badge" id="badge" hidden></span></a>
  <a href="#/briefs" data-tab="briefs">Briefs</a>
  <a href="#/agents" data-tab="agents">Agents</a>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';
import { AuthError, createSessionApi } from '/app/session.js';

const $view = document.getElementById('view');
const cfg = await (await fetch('/app/config')).json();
const sb = cfg.supabaseUrl ? createClient(cfg.supabaseUrl, cfg.supabaseKey, { auth: { persistSession: true, detectSessionInUrl: true, flowType: 'implicit' } }) : null;

// ---------- tiny DOM helpers (all text goes through textContent) ----------
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === undefined || v === null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
  return el;
}
const render = (...nodes) => { $view.replaceChildren(...nodes.flat().filter((n) => n !== null && n !== undefined && n !== false)); window.scrollTo(0, 0); };
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2600);
}
const ago = (iso) => {
  const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
  if (s < 90) return 'just now'; if (s < 3600) return `${Math.round(s / 60)}m ago`;
  if (s < 86400) return `${Math.round(s / 3600)}h ago`; return `${Math.round(s / 86400)}d ago`;
};
const rid = () => crypto.randomUUID();
// 6-field cron (sec min hour dom mon dow). Plain words for the common daily case, raw cron otherwise.
function describeSchedule(cron, tz) {
  const [sec, min, hour, dom, mon, dow] = cron.trim().split(/\s+/);
  const zone = tz === 'UTC' ? 'UTC' : tz.split('/').pop().replace(/_/g, ' ') + ' time';
  if (/^\d+$/.test(min) && /^\d+$/.test(hour) && dom === '*' && mon === '*' && dow === '*') {
    const d = new Date(Date.UTC(2000, 0, 1, +hour, +min));
    return `Daily ${d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'UTC' })} ${zone}`;
  }
  return `Schedule ${cron} (${tz})`;
}
const enc = encodeURIComponent;

// ---------- API ----------
let session = null;
// Auth rule: a 401 never signs out directly; see /app/session.js.
const { api, signOutHere } = createSessionApi({ sb, onSession: (s) => { session = s; } });

// ---------- screens ----------
function loginScreen(note) {
  document.getElementById('tabs').hidden = true;
  const email = h('input', { type: 'email', placeholder: 'you@example.com', autocomplete: 'email', enterkeyhint: 'go', required: true });
  const btn = h('button', { class: 'primary', type: 'submit' }, 'Email me a sign-in link');
  const form = h('form', { onsubmit: async (e) => {
    e.preventDefault();
    btn.disabled = true;
    const { error } = await sb.auth.signInWithOtp({ email: email.value.trim(), options: { emailRedirectTo: `${location.origin}/app`, shouldCreateUser: false } });
    btn.disabled = false;
    if (error) return toast(error.message);
    codeScreen(email.value.trim());
  } }, email, btn);
  render(h('header', { class: 'top' }, h('span', { class: 'brand' }, 'Agent Ops')), h('h1', {}, 'Sign in'),
    note ? h('p', { class: 'muted' }, note) : null, form);
}

// The email carries both a link and a code. The code avoids Gmail's threading (repeat emails collapse,
// and only the newest link is valid) and works when the email is read on another device.
function codeScreen(address) {
  const code = h('input', { type: 'text', inputmode: 'numeric', autocomplete: 'one-time-code', enterkeyhint: 'go',
    pattern: '[0-9]*', maxlength: '10', placeholder: '123456', required: true, class: 'code' });
  const btn = h('button', { class: 'primary', type: 'submit' }, 'Sign in');
  const form = h('form', { onsubmit: async (e) => {
    e.preventDefault();
    btn.disabled = true;
    const { data, error } = await sb.auth.verifyOtp({ email: address, token: code.value.replace(/\D/g, ''), type: 'email' });
    btn.disabled = false;
    if (error) return toast(/expired|invalid/i.test(error.message) ? 'That code is expired or not the newest one. Use the latest email.' : error.message);
    session = data.session;
    go('#/');
  } }, code, btn);
  render(h('header', { class: 'top' }, h('span', { class: 'brand' }, 'Agent Ops')), h('h1', {}, 'Check your email'),
    h('p', { class: 'muted' }, `Enter the code sent to ${address}, or tap the link in the newest email.`), form,
    h('button', { class: 'back', onclick: () => loginScreen() }, 'Use a different email'));
  code.focus();
}

function actionButtons(item, after) {
  return item.actions.map((a) => h('button', {
    class: a.style ?? '',
    onclick: async (e) => {
      e.stopPropagation();
      if (a.id === 'open') {
        if (item.type === 'deeper_ready') return go(`#/brief/${enc(item.ref.split('/')[0])}`);
        return go(item.type.startsWith('brief') ? `#/brief/${enc(item.ref)}` : `#/item/${enc(item.type)}/${enc(item.ref)}`);
      }
      if (a.id === 'reject' && !confirm(`Reject "${item.title}"?`)) return;
      e.currentTarget.disabled = true;
      try {
        const r = await api(`/attention/${enc(item.type)}/${enc(item.ref)}/${a.id}`, { method: 'POST', body: { requestId: rid() } });
        if (r.body.redirect) { location.href = r.body.redirect; return; }
        toast(r.body.message || (r.status < 300 ? 'Done' : 'Failed'));
        after();
      } catch (err) { handleErr(err); }
    },
  }, a.label));
}

async function needsYou() {
  const { body: items } = await api('/attention');
  setBadge(items.length);
  const cards = items.map((it) => h('div', { class: 'card tap', onclick: () => go(`#/item/${enc(it.type)}/${enc(it.ref)}`) },
    h('div', { class: 'src' }, h('span', {}, it.source), h('span', { class: `sev-${it.severity}` }, ago(it.createdAt))),
    h('div', { class: 'title' }, it.title),
    it.summary ? h('div', { class: 'summary' }, it.summary) : null,
    h('div', { class: 'actions' }, actionButtons(it, needsYou))));
  render(
    h('header', { class: 'top' }, h('span', { class: 'brand' }, 'Agent Ops'), h('button', { class: 'back', onclick: () => route() }, 'Refresh')),
    h('h1', {}, 'Needs You', h('span', { class: 'count' }, String(items.length))),
    ...(cards.length ? cards : [h('div', { class: 'empty' }, h('b', {}, 'Nothing needs you'), 'Agents are running on their own.')]),
  );
}

async function itemDetail(type, ref) {
  const r = await api(`/attention/${enc(type)}/${enc(ref)}`);
  if (r.status === 404) {
    render(h('button', { class: 'back', onclick: () => go('#/') }, '‹ Needs You'), h('div', { class: 'empty' }, h('b', {}, 'All done'), 'This no longer needs you.'));
    return;
  }
  const { item, facts } = r.body;
  render(
    h('button', { class: 'back', onclick: () => go('#/') }, '‹ Needs You'),
    h('div', { class: 'src' }, h('span', {}, item.source), h('span', { class: `sev-${item.severity}` }, ago(item.createdAt))),
    h('h2', {}, item.title),
    item.summary ? h('p', { class: 'summary' }, item.summary) : null,
    h('div', { class: 'actions' }, actionButtons(item, () => go('#/'))),
    h('div', { class: 'card', style: 'margin-top:16px' }, h('dl', {}, facts.flatMap((f) => [h('dt', {}, f.label), h('dd', {}, f.value)]))),
  );
}

async function briefs() {
  const { body: list } = await api('/briefs');
  render(
    h('header', { class: 'top' }, h('span', { class: 'brand' }, 'Agent Ops')), h('h1', {}, 'Briefs'),
    ...(list.length ? list.map((b) => h('div', { class: 'card tap', onclick: () => go(`#/brief/${b.id}`) },
      h('div', { class: 'src' }, h('span', {}, b.brief_date), h('span', {}, `${b.item_count} to prep`)),
      h('div', { class: 'title' }, b.headline ?? 'Brief'))) : [h('div', { class: 'empty' }, h('b', {}, 'No briefs yet'), 'The first one arrives at 8 PM.')]),
  );
}

// One card per meeting worth preparing for. Scan → understand why → act, in seconds.
let briefTimer;
async function brief(id) {
  clearTimeout(briefTimer);
  const r = await api(`/briefs/${enc(id)}`);
  if (r.status !== 200) return render(h('button', { class: 'back', onclick: () => history.back() }, '‹ Back'), h('div', { class: 'empty' }, 'Brief not found.'));
  const b = r.body;
  // Opening the brief clears its Needs You items; refresh the badge so it doesn't lag behind.
  api(`/briefs/${b.id}/seen`, { method: 'POST' }).then(() => api('/attention')).then((x) => setBadge(x.body.length)).catch(() => undefined);
  const route0 = location.hash;
  const again = () => { if (location.hash === route0) brief(id); };
  const tz = b.timezone;
  const time = (iso) => new Date(iso).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: tz });
  const range = (s, e) => `${time(s)}–${time(e)}`;
  const day = new Date(`${b.brief_date}T12:00:00Z`).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' });
  const post = async (path, body) => { try { const x = await api(path, { method: 'POST', body: body ?? {} }); if (x.body?.message) toast(x.body.message); } catch (err) { handleErr(err); } again(); };

  const holdRow = (c) => {
    const hd = c.hold;
    if (!hd) return c.holdNote && c.holdNote !== 'Marked not useful'
      ? [h('div', { class: 'label' }, 'Prep hold'), h('div', { class: 'muted' }, c.holdNote)] : [];
    const right = {
      pending: () => h('span', { class: 'actions', style: 'margin:0' },
        h('button', { class: 'primary', onclick: (e) => { e.currentTarget.disabled = true; post(`/attention/approval_needed/${hd.actionId}/approve`, { requestId: rid() }); } }, 'Approve'),
        h('button', { class: 'danger', onclick: (e) => { e.currentTarget.disabled = true; post(`/attention/approval_needed/${hd.actionId}/reject`, { requestId: rid() }); } }, 'Reject')),
      approving: () => h('span', { class: 'tag' }, 'Approving…'),
      approved: () => h('span', { class: 'ok' }, 'Approved ✓'),
      rejected: () => h('span', { class: 'tag' }, 'Rejected'),
      failed: () => h('span', { class: 'warn' }, 'No longer fits'),
    }[hd.status]();
    return [h('div', { class: 'label' }, 'Prep hold'), h('div', { class: 'kv' }, h('span', {}, range(hd.start, hd.end)), right),
      hd.note && hd.status !== 'failed' ? h('div', { class: 'muted' }, hd.note) : null,
      hd.status === 'failed' && hd.note ? h('div', { class: 'muted' }, hd.note) : null];
  };

  const sourcesBlock = (c) => {
    if (!c.sources.length) return [];
    const row = (s) => h('div', { class: 'kv' }, h('a', { href: s.url, target: '_blank', rel: 'noopener noreferrer' }, `${s.label} ↗`),
      h('span', { class: 'tag' }, s.provenance === 'event' ? 'Event' : 'Used for prep'));
    if (c.sources.length <= 2) return [h('div', { class: 'label' }, 'Sources'), ...c.sources.map(row)];
    const list = h('div', { hidden: true }, ...c.sources.map(row));
    const toggle = h('button', { class: 'linkbtn', onclick: () => { list.hidden = !list.hidden; toggle.textContent = `${list.hidden ? '▸' : '▾'} Sources (${c.sources.length})`; } }, `▸ Sources (${c.sources.length})`);
    return [toggle, list];
  };

  // Light rendering of the deeper-prep markdown: "## Heading" → bold line, "- x" → bullet, **bold** inline.
  const inline = (text) => text.split(/(\*\*[^*]+\*\*)/g).filter(Boolean)
    .map((part) => (/^\*\*[^*]+\*\*$/.test(part) ? h('strong', {}, part.slice(2, -2)) : part));
  const deeperBox = (text) => h('div', { class: 'deeper' }, ...text.split('\n').map((line) =>
    /^#{1,6}\s/.test(line) ? h('b', {}, line.replace(/^#{1,6}\s/, ''))
      : h('div', {}, ...inline(line.replace(/^\s*[-*]\s/, '• ')))));

  const card = (c) => {
    const box = c.deeper.status === 'ready' ? deeperBox(c.deeper.content) : null;
    if (box) box.hidden = true;
    const deeperBtn = {
      none: () => h('button', { onclick: (e) => { e.currentTarget.disabled = true; e.currentTarget.textContent = 'Preparing…'; post(`/briefs/${b.id}/items/${enc(c.eventId)}/deeper`); } }, 'Deeper prep'),
      preparing: () => h('button', { disabled: true }, 'Preparing…'),
      ready: () => h('button', { onclick: (e) => { box.hidden = !box.hidden; e.currentTarget.textContent = box.hidden ? 'Deeper prep ✓' : 'Hide deeper prep'; } }, 'Deeper prep ✓'),
      failed: () => h('button', { onclick: () => post(`/briefs/${b.id}/items/${enc(c.eventId)}/deeper`) }, 'Retry deeper prep'),
    }[c.deeper.status]();
    return h('div', { class: 'card meeting' },
      h('div', { class: 'head' }, h('p', { class: 'title' }, c.title), h('span', { class: 'muted' }, c.localStart ?? 'All day')),
      h('div', { class: 'label' }, 'Why prep'), h('div', {}, c.why),
      c.prep.length ? [h('div', { class: 'label' }, 'Prep'), h('ul', { class: 'bullets' }, c.prep.map((p) => h('li', {}, p)))] : null,
      ...sourcesBlock(c),
      ...holdRow(c),
      h('div', { class: 'actions' }, deeperBtn,
        b.editable ? h('button', { onclick: (e) => { e.currentTarget.disabled = true; post(`/briefs/${b.id}/items/${enc(c.eventId)}/feedback`, { verdict: 'not_useful' }); } }, 'Not useful') : null),
      box);
  };

  render(
    h('button', { class: 'back', onclick: () => history.back() }, '‹ Back'),
    h('div', { class: 'src' }, h('span', {}, day), h('span', {}, `${b.cards.length} to prep · ${b.considered} considered`)),
    h('h2', {}, b.headline ?? 'Brief'),
    ...(b.cards.length ? b.cards.map(card)
      : b.dismissedCards.length ? [h('div', { class: 'empty' }, h('b', {}, 'All meetings marked not useful'), 'Undo below to bring one back.')]
      : [h('div', { class: 'empty' }, h('b', {}, 'Nothing to prepare for'), 'Enjoy the day.')]),
    b.dismissedCards.length ? h('div', { class: 'card dismissed' },
      h('div', { class: 'label', style: 'margin-top:0' }, `Not useful · ${b.dismissedCards.length}`),
      ...b.dismissedCards.map((d) => h('div', { class: 'kv' }, h('span', {}, `${d.title} · ${d.localStart ?? 'All day'}`),
        b.editable ? h('button', { class: 'linkbtn', onclick: () => post(`/briefs/${b.id}/items/${enc(d.eventId)}/feedback`, { verdict: 'clear' }) }, 'Undo') : null))) : null,
  );
  // While a deeper pass or an approval is in flight, quietly refresh; leaving the screen stops it.
  if (b.cards.some((c) => c.deeper.status === 'preparing' || c.hold?.status === 'approving')) briefTimer = setTimeout(again, 4000);
}

async function agents() {
  const { body: list } = await api('/agents');
  render(
    h('header', { class: 'top' }, h('span', { class: 'brand' }, 'Agent Ops')), h('h1', {}, 'Agents'),
    ...list.map((a) => h('div', { class: 'card' },
      h('div', { class: 'row' }, h('span', { class: 'title' }, a.name),
        h('span', { class: `pill ${a.enabled ? a.health_state ?? '' : ''}` }, a.enabled ? (a.health_state ?? 'idle') : 'off')),
      h('div', { class: 'muted' }, [
        a.schedule ? describeSchedule(a.schedule, a.timezone) : 'Manual only',
        a.last_finished_at ? ` · last run ${ago(a.last_finished_at)}${a.last_outcome ? ` (${a.last_outcome})` : ''}` : ' · no runs yet',
      ].join('')),
      a.enabled ? h('div', { class: 'actions' }, h('button', { onclick: async (e) => {
        e.currentTarget.disabled = true;
        try {
          const r = await api(`/agents/${enc(a.id)}/run`, { method: 'POST', body: { requestId: rid() } });
          toast(r.status === 202 ? `${a.name} started` : (r.body.error ?? 'Could not start'));
        } catch (err) { handleErr(err); }
        e.currentTarget.disabled = false;
      } }, 'Run now')) : null)),
    await notificationsCard(),
    h('p', { class: 'muted', style: 'margin-top:24px' }, `Signed in as ${session?.user?.email ?? '?'} · `,
      h('a', { href: '#', onclick: async (e) => { e.preventDefault(); await signOutHere(); route(); } }, 'Sign out')),
  );
}

// ---------- push notifications (one subscription per device) ----------
const b64ToBytes = (b64) => {
  const s = atob((b64 + '='.repeat((4 - (b64.length % 4)) % 4)).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(s, (c) => c.charCodeAt(0));
};
const deviceLabel = () => {
  const ua = navigator.userAgent;
  const os = /Android/.test(ua) ? 'Android' : /iPhone|iPad/.test(ua) ? 'iPhone/iPad' : /Windows/.test(ua) ? 'Windows' : /Mac/.test(ua) ? 'Mac' : 'Device';
  const br = /Edg\//.test(ua) ? 'Edge' : /Chrome\//.test(ua) ? 'Chrome' : /Firefox\//.test(ua) ? 'Firefox' : /Safari\//.test(ua) ? 'Safari' : '';
  return `${os}${br ? ` · ${br}` : ''}`;
};
const myDeviceId = () => { try { return localStorage.getItem('pushDeviceId'); } catch { return null; } };
const setMyDeviceId = (id) => { try { id ? localStorage.setItem('pushDeviceId', id) : localStorage.removeItem('pushDeviceId'); } catch { /* storage blocked */ } };

async function notificationsCard() {
  const supported = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window && cfg.pushPublicKey;
  const reg = supported ? await navigator.serviceWorker.getRegistration('/app/') : null;
  const sub = reg ? await reg.pushManager.getSubscription() : null;
  const { body: devices } = await api('/push/devices');
  const on = Boolean(sub) && devices.some((d) => d.id === myDeviceId() && !d.disabled_at);
  const turnOn = async (e) => {
    e.currentTarget.disabled = true;
    try {
      if ((await Notification.requestPermission()) !== 'granted') { toast('Notifications are blocked for this site in browser settings.'); return route(); }
      const r = await navigator.serviceWorker.ready;
      const s = (await r.pushManager.getSubscription()) ?? await r.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(cfg.pushPublicKey) });
      const x = await api('/push/devices', { method: 'POST', body: { subscription: s.toJSON(), label: deviceLabel() } });
      if (x.status !== 200) throw new Error(x.body.error ?? 'register failed');
      setMyDeviceId(x.body.id);
      toast('Notifications on for this device');
    } catch (err) { if (err instanceof AuthError) return handleErr(err); toast(`Could not turn on notifications: ${err.message}`); }
    route();
  };
  const turnOff = async () => {
    try { await sub?.unsubscribe(); } catch { /* already gone */ }
    if (myDeviceId()) await api(`/push/devices/${myDeviceId()}`, { method: 'DELETE' }).catch(() => undefined);
    setMyDeviceId(null);
    toast('Notifications off for this device');
    route();
  };
  const test = async () => { const x = await api(`/push/devices/${myDeviceId()}/test`, { method: 'POST' }); toast(x.body.message ?? 'Sent'); };
  return h('div', { class: 'card', style: 'margin-top:16px' },
    h('div', { class: 'row' }, h('span', { class: 'title' }, 'Notifications'),
      h('span', { class: `pill ${on ? 'healthy' : ''}` }, on ? 'on here' : 'off here')),
    h('div', { class: 'muted' }, 'Pushes only what needs you: approvals, a ready brief, reconnects, failures. Quiet 10 PM–7 AM.'),
    !supported ? h('p', { class: 'muted' }, 'Not supported in this browser. Install the app first.')
      : Notification.permission === 'denied' ? h('p', { class: 'muted' }, 'Blocked for this site. Allow notifications in browser settings.')
      : h('div', { class: 'actions' }, on
        ? [h('button', { onclick: test }, 'Send test'), h('button', { onclick: turnOff }, 'Turn off here')]
        : h('button', { class: 'primary', onclick: turnOn }, 'Turn on for this device')),
    devices.length ? h('ul', { class: 'items', style: 'margin-top:8px' }, devices.map((d) => h('li', {},
      h('div', { class: 'kv' }, h('span', {}, `${d.label}${d.id === myDeviceId() ? ' (this device)' : ''}`),
        h('button', { class: 'linkbtn', onclick: async () => { await api(`/push/devices/${d.id}`, { method: 'DELETE' }); if (d.id === myDeviceId()) setMyDeviceId(null); route(); } }, 'Remove')),
      h('div', { class: 'muted' }, d.disabled_at ? 'Expired: turn on again on that device'
        : d.last_error ? `Last error: ${d.last_error}` : d.last_sent_at ? `Last sent ${ago(d.last_sent_at)}` : 'Nothing sent yet')))) : null,
  );
}

// ---------- routing ----------
function setBadge(n) { const b = document.getElementById('badge'); b.textContent = String(n); b.hidden = !n; }
function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }
function handleErr(err) {
  if (err instanceof AuthError) return session ? loginScreen(err.message) : loginScreen();
  console.error(err); toast('Something went wrong. Pull to retry.');
}

async function route() {
  if (!sb) return render(h('div', { class: 'empty' }, h('b', {}, 'Not configured'), 'Mobile sign-in is not set up on this server.'));
  if (!session) return loginScreen();
  document.getElementById('tabs').hidden = false;
  const [, page, a, b] = (location.hash || '#/').slice(1).split('/');
  for (const t of document.querySelectorAll('nav.tabs a')) t.classList.toggle('on', t.dataset.tab === ({ briefs: 'briefs', brief: 'briefs', agents: 'agents' }[page] ?? 'needs'));
  try {
    if (page === 'item') await itemDetail(decodeURIComponent(a), decodeURIComponent(b));
    else if (page === 'briefs') await briefs();
    else if (page === 'brief') await brief(decodeURIComponent(a));
    else if (page === 'agents') await agents();
    else await needsYou();
  } catch (err) { handleErr(err); }
}

if (sb) {
  session = (await sb.auth.getSession()).data.session;
  sb.auth.onAuthStateChange((_event, s) => { const was = Boolean(session); session = s; if (was !== Boolean(s)) route(); });
}
addEventListener('hashchange', route);
// A tapped notification while the app is already open: go where it points (same origin, /app only).
navigator.serviceWorker?.addEventListener('message', (e) => {
  if (e.data?.type === 'open' && typeof e.data.url === 'string' && e.data.url.startsWith(`${location.origin}/app`)) location.href = e.data.url;
});
// Installability (Android WebAPK) needs an active service worker for the app's scope.
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/app/sw.js', { scope: '/app/' }).catch((e) => console.warn('sw', e));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && session) route(); });
// The magic link lands with tokens in the URL fragment; supabase-js consumes them, then start on Needs You.
if (/access_token|error_description/.test(location.hash)) history.replaceState(null, '', '/app/#/');
route();
</script>
</body>
